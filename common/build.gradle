architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
	mavenCentral()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Schematic parsing
	implementation 'net.sandrohc:schematic4j:1.1.0'
}

def farmingSelfTest = tasks.register('farmingSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic farming and checked EllieGPS waypoint self-tests.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.player2.playerengine.agentic.elliegps.FarmingSelfTestSuite')
    enableAssertions = true
}

tasks.register('gatewaySelfTest', JavaExec) {
    group = 'verification'
    description = 'Checks the OpenAI-gateway routing through the production HTTP path.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('com.player2.playerengine.player2api.gateway.GatewaySelfTest')
    enableAssertions = true
    // Blank values are ignored by GatewayConfig, so an operator's shell cannot leak into the test.
    ['ENABLED', 'URL', 'KEY', 'MODEL', 'EMBEDDING_MODEL', 'PATRON_TIER', 'CHARACTERS', 'KEY_FILE'].each {
        environment("PLAYERENGINE_GATEWAY_${it}", '')
    }
}

tasks.register('companionSelfTest', JavaExec) {
