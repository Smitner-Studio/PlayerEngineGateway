version: '3'

vars:
  JDK: 'C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot'
  GRADLEW: '{{fromSlash .ROOT_DIR}}\gradlew.bat'
  JAR: 'neoforge/build/libs/playerengine-neoforge-1.21.1-1.4.0-gateway.8.jar'

x-need-jdk: &need-jdk
  sh: test -f "{{.JDK}}/bin/javac.exe"
  msg: 'JDK 21 not found at {{.JDK}}. Install it (winget install EclipseAdoptium.Temurin.21.JDK -e) or pass JDK=<JDK 21 home>.'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: 'Build the NeoForge jar into {{.JAR}} [JDK]'
    preconditions:
      - *need-jdk
    env:
      JAVA_HOME: '{{.JDK}}'
    cmds:
      - cmd /d /c "{{.GRADLEW}}" :neoforge:build -x test --no-daemon
      - cmd: test -f "{{.JAR}}" && echo "built {{.JAR}}"
        silent: true

  test:
    desc: 'Run the gateway, companion-rules (reply contract included), area, program-interpreter and smoke-gate self-tests, and the stage-4 cutover grep gate [JDK]'
    preconditions:
      - *need-jdk
    env:
      JAVA_HOME: '{{.JDK}}'
    cmds:
      - cmd /d /c "{{.GRADLEW}}" :common:gatewaySelfTest :common:companionSelfTest :common:areaSelfTest :common:programSelfTest :common:smokeGateSelfTest --no-daemon -q

  lint-programs:
    desc: 'Lint a JSONL file of programs (lines of {"key", "source", "profile"}) into OUT, for the pack replay checker [IN, OUT, JDK]'
    requires:
      vars: [IN, OUT]
    preconditions:
      - *need-jdk
      - sh: test -f "{{.IN}}"
        msg: 'No programs file at {{.IN}}. Pass IN=<programs.jsonl>.'
    env:
      JAVA_HOME: '{{.JDK}}'
    cmds:
      - cmd /d /c "{{.GRADLEW}}" :common:lintPrograms -PlintIn="{{.IN}}" -PlintOut="{{.OUT}}" --no-daemon -q

  seam-signatures:
    desc: 'Regenerate the seam signature table, common/src/main/resources/playerengine/seam/signatures.json, after editing SignatureTable [JDK]'
    preconditions:
      - *need-jdk
    env:
      JAVA_HOME: '{{.JDK}}'
    cmds:
      - cmd /d /c "{{.GRADLEW}}" :common:seamSignatures --no-daemon -q
